[project]
name = "moon-maps-api"
version = "0.1.0"
description = "Moon Maps API: Sun and Earth visibility above the lunar terrain horizon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "skyfield>=1.49",
  "numpy>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kernels: needs the downloaded JPL kernels", "dem: needs the downloaded LOLA grids"]
